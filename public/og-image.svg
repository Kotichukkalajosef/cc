<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#171614"/>
  <!-- Subtle grid lines -->
  <line x1="120" y1="0" x2="120" y2="630" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="1080" y1="0" x2="1080" y2="630" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="0" y1="510" x2="1200" y2="510" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  
  <!-- Amber accent bar -->
  <rect x="120" y="160" width="60" height="4" fill="#E5932B"/>

  <!-- Logo Wordmark -->
  <text x="120" y="260" font-family="Inter, -apple-system, sans-serif" font-size="64" font-weight="800" letter-spacing="8" fill="#FFFFFF">CROREST</text>
  <text x="510" y="260" font-family="Inter, -apple-system, sans-serif" font-size="64" font-weight="800" letter-spacing="8" fill="#FFFFFF">ARS</text>
  <circle cx="530" cy="230" r="6" fill="#E5932B"/>

  <!-- Tagline -->
  <text x="120" y="340" font-family="Inter, -apple-system, sans-serif" font-size="36" font-weight="600" fill="#E5932B">Many Possibilities. One Vision.</text>

  <!-- Description -->
  <text x="120" y="410" font-family="Inter, -apple-system, sans-serif" font-size="20" font-weight="400" fill="rgba(255,255,255,0.65)">A developing corporate group founded on disciplined growth and strategic convergence.</text>

  <!-- URL -->
  <text x="120" y="555" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="600" letter-spacing="2" fill="rgba(255,255,255,0.4)">WWW.CRORESTARS.COM</text>
</svg>
